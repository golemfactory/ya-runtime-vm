[package]
name = "ya-vm-guest-agent"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
default = []
freestanding = ["dep:origin", "dep:talc"]

[dependencies]
ya-vm-agent-protocol = { path = "../agent-protocol", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Origin 0.26.2 requires the runtime API exposed by rustix 1.1.4.
rustix = { version = "=1.1.4", default-features = false, features = ["alloc", "fs", "mount", "net", "process", "thread", "system", "event", "pipe", "mm", "stdio", "runtime", "linux_5_1"] }
linux-raw-sys = { version = "0.12", default-features = false, features = ["general", "no_std", "netlink"] }
origin = { version = "=0.26.2", default-features = false, features = ["origin-start", "eh-personality-continue"], optional = true }
talc = { version = "=5.1.1", default-features = false, optional = true }

[[bin]]
name = "ya-vm-guest-agent"
path = "src/main.rs"
required-features = ["freestanding"]
test = false
bench = false

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std"] }
