[package]
name = "ya-runtime-vm"
description = "OpenVMM runtime for Linux task images"
version = "0.6.1-rc1"
authors = ["Golem Factory <contact@golem.network>"]
edition = "2024"
license = "GPL-3.0"

[package.metadata.deb]
assets = [
    ["../../build/guest/THIRD-PARTY-NOTICES.txt", "usr/share/doc/ya-runtime-vm/", "644"],
    [
        "target/release/ya-runtime-vm",
        "usr/lib/yagna/plugins/ya-runtime-vm/",
        "755",
    ],
    [
        "../../packaging/ya-runtime-vm.json",
        "usr/lib/yagna/plugins/",
        "644",
    ],
    # self-test.gvmi is downloaded by .github/workflows/release.yml from https://github.com/golemfactory/ya-self-test-img/releases
    [
        "../../build/guest/self-test.gvmi",
        "usr/lib/yagna/plugins/ya-runtime-vm/runtime/",
        "644",
    ],

    [
        "../../build/guest/initramfs.cpio.gz",
        "usr/lib/yagna/plugins/ya-runtime-vm/runtime/",
        "644",
    ],
    [
        "../../build/guest/vmlinuz-virt",
        "usr/lib/yagna/plugins/ya-runtime-vm/runtime/",
        "644",
    ],
]

[dependencies.ya-runtime-sdk]
workspace = true
features = ["macros", "logger"]

[dependencies]
ya-vm-agent-protocol = { path = "../agent-protocol" }
async-trait = "0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
anyhow = "1.0"
bollard-stubs = "1.40.2"
crc = "1.8"
futures = "0.3"
log = "0.4.8"
# Forward embedded OpenVMM events to the SDK logger when no tracing subscriber
# is installed, including the underlying error behind a fatal VM debug break.
tracing = { version = "0.1", features = ["log"] }
fuse = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
lx = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
virtio = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
virtiofs = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
# Patched to third_party/virtio_net for a per-device MTU.
virtio_net = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
mesh = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
mesh_worker = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
net_backend = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
inspect = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
pal_async = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
parking_lot = "0.12"
# Enable source builds and static linking for OpenVMM's OpenSSL dependency.
openssl = { version = "0.10", features = ["vendored"] }
openvmm_core = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
openvmm_defs = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
vmm_core_defs = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
hypervisor_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
virtio_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
disk_backend_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
net_backend_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
serial_socket = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
serial_core = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
vm_resource = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
vm_manifest_builder = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
vmgs_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
virtio_vsock = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
# "crossbeam-channel" and "macos_fsevent" are default features. 
# Remove `macos_fsevent` if `macos` build will get dropped.
notify = { version = "6.0", features = ["crossbeam-channel", "macos_fsevent"] }
rand = "0.8"
raw-cpuid = "10.7"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
structopt = "0.3"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
] }
tokio-byteorder = "0.3"
uuid = { version = "1.1", features = ["v4"] }
url = "2.5.4"
ya-client-model.workspace = true

[dev-dependencies]
env_logger = "0.10"
guestmem = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }
zerocopy = "0.8"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Embedded core does not select a crypto backend as the OpenVMM CLI does.
# Force vendored OpenSSL instead of the musl default's shared SymCrypt backend.
openvmm_crypto = { package = "crypto", git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e", features = ["openssl", "vendored"] }
openvmm_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e", features = ["virt_kvm"] }
vfio_assigned_device_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e" }

[target.'cfg(windows)'.dependencies]
openvmm_crypto = { package = "crypto", git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e", features = ["native"] }
openvmm_resources = { git = "https://github.com/microsoft/openvmm.git", rev = "8a150698f4b8e39344f4c7099b53e20b5d54f72e", features = ["virt_whp"] }
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[lib]
name = "ya_runtime_vm"
path = "src/lib.rs"

[[bin]]
name = "ya-runtime-vm"
path = "src/main.rs"
