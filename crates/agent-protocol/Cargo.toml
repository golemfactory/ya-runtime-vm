[package]
name = "ya-vm-agent-protocol"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
default = ["std"]
std = ["serde/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-crc"] }
crc = { version = "3", default-features = false }
