# Derived from Microsoft OpenVMM. See README.md for provenance and changes.
[package]
name = "fuse"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
ci = []

[dependencies]
bitfield-struct = "0.11.0"
parking_lot = "0.12"
thiserror = { version = "2", default-features = false }
tracing = "0.1"
zerocopy = { version = "0.8.25", features = ["derive"] }
lx = { git = "https://github.com/microsoft/openvmm.git", rev = "88e78be49228ead4f324bf3e9252769f453059ad" }
tracelimit = { git = "https://github.com/microsoft/openvmm.git", rev = "88e78be49228ead4f324bf3e9252769f453059ad" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
tempfile = "3.2"
test_with_tracing = { git = "https://github.com/microsoft/openvmm.git", rev = "88e78be49228ead4f324bf3e9252769f453059ad" }
