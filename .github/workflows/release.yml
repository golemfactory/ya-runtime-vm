name: Release
on:
  push:
    tags:
      - v*
      - pre-rel-*

permissions:
  contents: write

env:
  self-test-img_tag: v0.1.4
  self-test-img_repository: golemfactory/ya-self-test-img
  rust_stable: 1.80.0

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create draft with release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#pre-rel-}"
          VERSION="${VERSION#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          NOTES=".github/release-notes/${VERSION}.md"
          if test -f "$NOTES"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build-qemu:
    name: Build QEMU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build static Linux x86_64 runtime
        run: make -C qemu
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-runtime
          path: runtime/poc/runtime/

  build-init:
    name: Build container init
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools autoconf gperf libtool automake cpio
      - name: Build and test init
        run: make -C runtime/init-container SHELL=/bin/bash all test
      - uses: actions/upload-artifact@v4
        with:
          name: init-container
          path: |
            runtime/init-container/initramfs.cpio.gz
            runtime/init-container/vmlinuz-virt

  package:
    name: Build and package Linux runtime
    needs: [create-release, build-init, build-qemu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qemu-runtime
          path: runtime/poc/runtime/
      - run: chmod +x runtime/poc/runtime/vmrt
      - uses: actions/download-artifact@v4
        with:
          name: init-container
          path: runtime/init-container/
      - name: Download self-test image
        run: |
          mkdir -p runtime/image
          gh release download "$self_test_tag" --repo "$self_test_repo" --pattern self-test.gvmi --dir runtime/image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          self_test_tag: ${{ env.self-test-img_tag }}
          self_test_repo: ${{ env.self-test-img_repository }}
      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libssl-dev liblzma-dev cmake dpkg-dev
          rustup toolchain install "$rust_stable" --profile minimal --target x86_64-unknown-linux-musl
      - name: Build runtime
        run: cargo +${rust_stable} build --locked --release --target x86_64-unknown-linux-musl
      - name: Synchronize and verify descriptor version
        run: |
          python3 .github/scripts/sync-runtime-version.py
          VERSION="${GITHUB_REF_NAME#pre-rel-}"
          VERSION="${VERSION#v}"
          python3 -c 'import json, sys; assert json.load(open("runtime/conf/ya-runtime-vm.json"))[0]["version"] == sys.argv[1]' "$VERSION"
      - name: Pack Linux archive
        run: |
          TARGET_DIR="releases/ya-runtime-vm-linux-${GITHUB_REF_NAME}"
          mkdir -p "$TARGET_DIR/ya-runtime-vm/runtime"
          strip target/x86_64-unknown-linux-musl/release/ya-runtime-vm
          cp target/x86_64-unknown-linux-musl/release/ya-runtime-vm "$TARGET_DIR/ya-runtime-vm/"
          cp runtime/conf/ya-runtime-vm.json "$TARGET_DIR/"
          cp -r runtime/poc/runtime/. "$TARGET_DIR/ya-runtime-vm/runtime/"
          cp runtime/image/self-test.gvmi runtime/init-container/initramfs.cpio.gz runtime/init-container/vmlinuz-virt "$TARGET_DIR/ya-runtime-vm/runtime/"
          tar -C releases -czf "releases/ya-runtime-vm-linux-${GITHUB_REF_NAME}.tar.gz" "ya-runtime-vm-linux-${GITHUB_REF_NAME}"
      - name: Pack Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#pre-rel-}"
          VERSION="${VERSION#v}"
          cargo +${rust_stable} install cargo-deb --version 2.5.1 --locked
          cargo +${rust_stable} deb --manifest-path runtime/Cargo.toml --no-build --target x86_64-unknown-linux-musl --deb-version "$VERSION" --output "releases/ya-runtime-vm_${GITHUB_REF_NAME}_amd64.deb"
      - name: Verify packaged binaries
        run: |
          target/x86_64-unknown-linux-musl/release/ya-runtime-vm --version
          runtime/poc/runtime/vmrt --version
          dpkg-deb --info "releases/ya-runtime-vm_${GITHUB_REF_NAME}_amd64.deb"
          cd releases
          sha256sum "ya-runtime-vm-linux-${GITHUB_REF_NAME}.tar.gz" "ya-runtime-vm_${GITHUB_REF_NAME}_amd64.deb" > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "releases/ya-runtime-vm-linux-${GITHUB_REF_NAME}.tar.gz" "releases/ya-runtime-vm_${GITHUB_REF_NAME}_amd64.deb" releases/SHA256SUMS --clobber

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#pre-rel-}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-* || "$GITHUB_REF_NAME" == pre-rel-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
