name: Release
on:
  push:
    tags: ['v*', 'pre-rel-*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish validated runtime packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true
          path: releases
      - name: Verify release version and checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#pre-rel-}"
          VERSION="${VERSION#v}"
          mise exec -- python -c 'import tomllib,sys; assert tomllib.load(open("crates/runtime/Cargo.toml","rb"))["package"]["version"] == sys.argv[1], "tag differs from Cargo version"' "$VERSION"
          cd releases
          sha256sum --check *.sha256
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#pre-rel-}"
          VERSION="${VERSION#v}"
          if ! mise exec -- gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            NOTES=".github/release-notes/${VERSION}.md"
            if test -f "$NOTES"; then
              mise exec -- gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
            else
              mise exec -- gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          mise exec -- gh release upload "$GITHUB_REF_NAME" releases/*.tar.gz releases/*.zip releases/*.deb releases/*.sha256 --clobber
          if [[ "$VERSION" == *-* || "$GITHUB_REF_NAME" == pre-rel-* ]]; then
            mise exec -- gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            mise exec -- gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
