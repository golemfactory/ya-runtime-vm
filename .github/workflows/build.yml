name: Build

on:
  push:
    branches: [master, 'release/*']
  pull_request:
    branches: [master, 'release/*']
  workflow_call:

permissions:
  contents: read

jobs:
  guest:
    name: Linux guest image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: guest
      - run: mise run lint-workflows
      - run: mise run guest-lint
      - run: mise run guest-image
      - run: mise run vm-probe-build
      - run: mise run fetch-self-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-guest
          path: |
            build/guest/vmlinuz-virt
            build/guest/initramfs.cpio.gz
            build/guest/self-test.gvmi
            build/guest/vm-test-probe
          if-no-files-found: error

  native:
    name: Runtime on ${{ matrix.os }}
    needs: guest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-guest
          path: build/guest
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - name: Configure musl C toolchain
        if: runner.os == 'Linux'
        run: mise run ci-setup-linux
      - run: mise run ci
      - name: Enable KVM for the Linux VM tests
        if: runner.os == 'Linux'
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod 660 /dev/kvm
      - name: OpenVMM integration tests
        if: runner.os == 'Linux'
        run: mise run vm-test
      - name: VM boot and runtime logs
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-linux-logs
          path: target/vm-test/*.stderr.log
          if-no-files-found: ignore
      - run: mise run package
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          mise run package-deb
          cp target/x86_64-unknown-linux-musl/debian/*.deb releases/
          cd releases
          sha256sum ./*.deb > debian.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ runner.os }}
          path: |
            releases/*.tar.gz
            releases/*.zip
            releases/*.sha256
            releases/*.deb
          if-no-files-found: error
