name: Build

on:
  push:
    branches: [master, 'release/*']
  pull_request:
    branches: [master, 'release/*']
  workflow_call:

permissions:
  contents: read

jobs:
  guest:
    name: Linux guest image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: guest
      - run: mise run guest-image
      - run: mise run fetch-self-test
      - uses: actions/upload-artifact@v4
        with:
          name: linux-guest
          path: |
            build/guest/vmlinuz-virt
            build/guest/initramfs.cpio.gz
            build/guest/self-test.gvmi
          if-no-files-found: error

  native:
    name: Runtime on ${{ matrix.os }}
    needs: guest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-guest
          path: build/guest
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev liblzma-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Cache Windows OpenSSL
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: windows-openssl-static-md-v1
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci
      - run: mise run package
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          mise run package-deb
          cp target/debian/*.deb releases/
          cd releases
          sha256sum *.deb > debian.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ runner.os }}
          path: |
            releases/*.tar.gz
            releases/*.zip
            releases/*.sha256
            releases/*.deb
          if-no-files-found: error
