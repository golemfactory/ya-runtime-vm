[workspace]
members = [
    "crates/runtime",
    "crates/agent-protocol",
    "crates/guest-agent",
    "third_party/fuse",
    "third_party/virtio_net",
]
default-members = ["crates/runtime", "crates/agent-protocol"]
resolver = "2"

[workspace.dependencies]
ya-runtime-sdk = { git = "https://github.com/golemfactory/ya-runtime-sdk.git", rev = "0395b0c704ef644d7f0554ac41e319f03b11c068" }
ya-runtime-api = { git = "https://github.com/golemfactory/yagna.git", rev = "2222cadeed58ecc44295092fcb0bc9ffba8a3722"}
ya-client-model = { git = "https://github.com/golemfactory/ya-client.git", rev = "44746845a559d40faa2a81d41c6f663d38361286" }

[profile.guest]
inherits = "release"
lto = "fat"
strip = "symbols"
panic = "abort"

# Apply the bounded decoder to every OpenVMM FUSE consumer, including virtiofs.
[patch."https://github.com/microsoft/openvmm.git"]
fuse = { path = "third_party/fuse" }
# Allow a per-device MTU; see third_party/virtio_net/README.md.
virtio_net = { path = "third_party/virtio_net" }
